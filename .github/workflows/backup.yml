name: Encrypted backup and restore rehearsal
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.KRONR_BACKUP_SUPABASE_TOKEN }}
      KRONR_BACKUP_KEY: ${{ secrets.KRONR_BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official PostgreSQL tools and encryption library
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-17
          python -m pip install 'cryptography>=46,<47'
      - name: Create encrypted snapshot
        run: python scripts/backup-kronr.py --output "$RUNNER_TEMP/encrypted-backups" --pg-dump /usr/lib/postgresql/17/bin/pg_dump
      - name: Retain encrypted off-site backup
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-kronr-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-backups/*.fernet
          if-no-files-found: error
          retention-days: 30
      - name: Restore into isolated loopback database and run regression suites
        run: |
          backup=$(find "$RUNNER_TEMP/encrypted-backups" -name '*.fernet' -type f | head -1)
          python scripts/test-backup-restore.py "$backup" --bin /usr/lib/postgresql/17/bin --workroot "$RUNNER_TEMP/restore-test"
      - name: Retain non-sensitive verification report
        uses: actions/upload-artifact@v4
        with:
          name: restore-report-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-test/restore-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain encrypted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-restore-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-test/restore-diagnostics.fernet
          if-no-files-found: ignore
          retention-days: 7
